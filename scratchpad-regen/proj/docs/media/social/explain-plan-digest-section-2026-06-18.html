<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Card</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #388bfd;
      --quote-mark: #1f6feb;
      --card-width: 1024px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: min(var(--card-width), 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .context-tag {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      padding: 16px 32px 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 600;
    }

    .quote-body {
      padding: 32px 48px;
    }

    .quote-mark {
      font-size: 72px;
      line-height: 0.8;
      color: var(--quote-mark);
      opacity: 0.6;
      font-family: Georgia, serif;
      display: block;
      margin-bottom: 8px;
    }

    blockquote {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--text);
      font-style: italic;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--accent);
      margin: 16px auto;
      border-radius: 1px;
    }

    .attribution {
      padding: 0 48px 28px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .attribution::before {
      content: '— ';
    }

    /* ── Copy panel ── */
    .copy-panel {
      width: min(var(--card-width), 100%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
    }

    .copy-panel + .copy-panel { margin-top: 0; }

    .copy-label {
      color: #8b949e;
      font-size: 12px;
      margin: 0 0 8px;
    }

    .post-copy-text {
      width: 100%;
      min-height: 80px;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
      display: block;
    }

    .copy-btn {
      margin-top: 8px;
      padding: 6px 16px;
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .copy-btn:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">
    <span class="context-tag">Claude Code Plugin Pattern</span>
    <div class="quote-body">
      <span class="quote-mark">"</span>
      <blockquote>Ship the human render and the machine-readable spec in one file. Each reader takes only the layer it needs — progressive disclosure, applied to a document.</blockquote>
    </div>
    <div class="divider"></div>
    <p class="attribution">agentics · plan-agent</p>
  </div>
  <div class="copy-panel">
  <p class="copy-label">LinkedIn</p>
  <textarea readonly class="post-copy-text" id="post-copy-linkedin">A generated HTML plan is ~79KB of CSS, inline SVG, and JavaScript. The actual spec inside it — objective, steps, tests, acceptance criteria — is a few KB. So every time an AI agent re-opens that plan to implement, review, or fan it into a workflow, it burns ~20K tokens of presentation noise to recover what it needs.

The fix is a pattern worth stealing: embed a machine-readable digest.

In plan-agent's HTML plans, the first child of &lt;body&gt; is a &lt;script type="text/markdown" id="plan-digest"&gt; block. Three things make it work:

1. It's inert. Browsers don't render or execute an unknown script type, so the plan looks and behaves exactly the same — zero visual or runtime cost.

2. It's spec-only. The digest carries objective, context, files, steps (action/why/verify), tests, and criteria — and omits all mutable state. Status, checkboxes, and progress live in &lt;head&gt; meta tags and the live DOM, never in the digest. So flipping a status can't corrupt the spec.

3. It's cheaply extractable. One awk line pulls just the spec — downstream tools read ~79 lines instead of ~79KB.

The principle: progressive disclosure applied to a document. Ship the human render and the machine spec in the same file, and let each reader take only the layer it needs.

More Claude Code plugin patterns like this on my feed.

#ClaudeCode #AITools #DeveloperTools #Automation</textarea>
  <button class="copy-btn" onclick="copyPost('post-copy-linkedin', this)">Copy LinkedIn post</button>
</div>
<div class="copy-panel">
  <p class="copy-label">Twitter/X</p>
  <textarea readonly class="post-copy-text" id="post-copy-twitter">AI agents re-read your HTML artifacts constantly. Don't make them parse 79KB of CSS/JS for a few KB of spec.

plan-agent embeds a spec-only &lt;script type="text/markdown"&gt; digest as &lt;body&gt;'s first child — inert, state-free, one awk line to extract. #ClaudeCode</textarea>
  <button class="copy-btn" onclick="copyPost('post-copy-twitter', this)">Copy Twitter/X post</button>
</div>
<div class="copy-panel">
  <p class="copy-label">Bluesky</p>
  <textarea readonly class="post-copy-text" id="post-copy-bluesky">Nice pattern from agentics' plan-agent: its HTML plans embed a spec-only digest as &lt;body&gt;'s first child via &lt;script type="text/markdown"&gt;.

The file is ~79KB of CSS/JS; the digest is the few-KB spec an agent needs — inert, state-free, one awk line to pull. Progressive disclosure for a doc.</textarea>
  <button class="copy-btn" onclick="copyPost('post-copy-bluesky', this)">Copy Bluesky post</button>
</div>
<div class="copy-panel">
  <p class="copy-label">Substack</p>
  <textarea readonly class="post-copy-text" id="post-copy-substack">A small idea with outsized payoff for agent workflows.

plan-agent's HTML plans are ~79KB of styling and script — but the spec an agent needs (objective, steps, tests, criteria) is a few KB. So each plan embeds a spec-only &lt;script type="text/markdown"&gt; digest as &lt;body&gt;'s first child: it never renders, holds no mutable state, and extracts with one awk line.

When an artifact has a human and a machine reader, give each its own layer in one file.

More Claude Code patterns in the newsletter.</textarea>
  <button class="copy-btn" onclick="copyPost('post-copy-substack', this)">Copy Substack post</button>
</div>
  <script>
    function copyPost(id, btn) {
      var t = document.getElementById(id);
      if (!t) return;
      var orig = btn.textContent;
      function done() {
        btn.textContent = 'Copied ✓';
        setTimeout(function () { btn.textContent = orig; }, 2000);
      }
      function fallback() { try { t.select(); if (document.execCommand('copy')) done(); } catch (_) {} }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t.value).then(done).catch(fallback);
      } else {
        fallback();
      }
    }
  </script>
</body>
</html>
