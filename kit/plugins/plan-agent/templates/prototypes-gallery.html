<!DOCTYPE html>
<!--
  prototypes-gallery.html — Prototypes library index for plan-agent.

  Static variables (substituted by build-prototypes-index.sh):
    GALLERY_ENTRIES  — Repeated <a> blocks, one per prototype file
    PROTO_COUNT      — Total number of prototypes displayed
    GENERATED_AT     — Date and time of gallery generation
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototypes Library</title>
  <style>
    :root {
      --bg:#ffffff; --surface:#f9fafb; --border:#e5e7eb; --border-mid:#d1d5db;
      --text:#111827; --muted:#6b7280; --subtle:#9ca3af; --accent:#2563eb;
      --accent-bg:#eff6ff; --radius:4px; --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
           font-size:15px; min-height:100vh; padding:32px; }
    .gallery-header { max-width:1200px; margin:0 auto 24px; border-bottom:1px solid var(--border); padding-bottom:16px; }
    .gallery-header::before { content:""; display:block; height:3px; background:var(--accent); margin-bottom:20px; border-radius:2px; }
    .gallery-header h1 { font-size:22px; font-weight:700; letter-spacing:-.02em; margin-bottom:4px; }
    .gallery-header p { font-size:13px; color:var(--muted); }
    .toolbar { max-width:1200px; margin:0 auto 14px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .search-box { flex:1; min-width:200px; max-width:320px; padding:7px 12px; background:var(--bg);
                  border:1px solid var(--border-mid); border-radius:var(--radius); color:var(--text);
                  font-size:13px; font-family:inherit; outline:none; transition:border-color .15s; }
    .search-box:focus { border-color:var(--accent); }
    .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px;
                    max-width:1200px; margin:0 auto; }
    .gallery-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
                    padding:16px; text-decoration:none; color:inherit; display:flex; flex-direction:column;
                    gap:10px; box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s; }
    .gallery-card:hover { border-color:var(--accent); box-shadow:0 4px 12px rgba(37,99,235,.1); }
    .gallery-card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .card-title { font-size:14px; font-weight:600; color:var(--text); line-height:1.45; }
    .card-meta { display:flex; flex-direction:column; gap:3px; margin-top:auto; }
    .card-date { font-size:12px; color:var(--muted); }
    .card-source { font-size:12px; color:var(--subtle); }
    .card-file { font-size:11px; color:var(--subtle); font-family:ui-monospace,Consolas,monospace; word-break:break-all; }
    .no-results { max-width:1200px; margin:48px auto; text-align:center; color:var(--muted); font-size:14px; display:none; }
    .gallery-footer { max-width:1200px; margin:32px auto 0; padding-top:16px; border-top:1px solid var(--border);
                      display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--muted); }
    @media (max-width:640px) { body { padding:16px; } .search-box { max-width:none; } }
  </style>
</head>
<body>

  <div class="gallery-header">
    <h1>Prototypes Library</h1>
    <p>{{PROTO_COUNT}} prototypes &mdash; clickable proofs of plans</p>
  </div>

  <div class="toolbar">
    <input type="text" class="search-box" id="searchBox"
           placeholder="Search by title..." aria-label="Search prototypes by title">
  </div>

  <div class="gallery-grid" id="galleryGrid">
    {{GALLERY_ENTRIES}}
  </div>

  <div class="no-results" id="noResults">No prototypes yet.</div>

  <div class="gallery-footer">
    <span>{{PROTO_COUNT}} prototypes</span>
    <span>Generated {{GENERATED_AT}}</span>
  </div>

  <script>
    var grid      = document.getElementById('galleryGrid');
    var cards     = grid.querySelectorAll('.gallery-card');
    var noResults = document.getElementById('noResults');

    function applyFilter(text) {
      var shown = 0;
      for (var i = 0; i < cards.length; i++) {
        var title = cards[i].getAttribute('data-title') || '';
        if (!text || title.indexOf(text) !== -1) { cards[i].style.display = ''; shown++; }
        else { cards[i].style.display = 'none'; }
      }
      noResults.style.display = shown === 0 ? 'block' : 'none';
    }

    document.getElementById('searchBox').addEventListener('input', function () {
      applyFilter(this.value.trim().toLowerCase());
    });

    applyFilter('');
  </script>
</body>
</html>
