<!DOCTYPE html>
<!--
  video-card.html — Dark-mode video preview card for social posts.
  Supports YouTube and Vimeo. Thumbnail is optional.

  Static variables (always substituted):
    {{VIDEO_TITLE}}         — Title of the video
    {{CHANNEL}}             — Channel or creator name (author_name from oEmbed)
    {{PLATFORM_BADGE}}      — "YouTube" or "Vimeo"
    {{PLATFORM_COLOR}}      — Hardcoded by skill: #ff0000 (YouTube) or #1ab7ea (Vimeo)
                              NEVER sourced from user input or fetched content.
    {{DESCRIPTION_SNIPPET}} — First 150 chars of video description
    {{CTA}}                 — "▶ Watch on YouTube" or "▶ Watch on Vimeo"

  Conditional element variable (skill injects full HTML block or ""):
    {{THUMBNAIL_ZONE}} — When thumbnail_url is available:
        <div class="video-thumbnail">
          <img src="THUMBNAIL_URL" alt="Video thumbnail">
          <div class="play-overlay"><span class="play-icon">&#9654;</span></div>
        </div>
      When unavailable: "" (entire block omitted, card starts at video-body)

  Note: all text values must be HTML-escaped by the skill before substitution.

  {{COPY_PANELS}} — Copy panel HTML: one panel for a single site, or three per-site panels for "All sites" (see variables.md)
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{VIDEO_TITLE}}</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --platform: {{PLATFORM_COLOR}};
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: min(1024px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* ── Thumbnail zone (conditional — injected by skill or omitted) ── */
    .video-thumbnail {
      position: relative;
      height: 180px;
      overflow: hidden;
      background: #000;
    }

    .video-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      display: block;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }

    .play-icon {
      font-size: 48px;
      color: #ffffff;
      opacity: 0.92;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
      line-height: 1;
    }

    /* ── Body ── */
    .video-body {
      padding: 20px 24px 16px;
    }

    .platform-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .platform-badge {
      display: inline-block;
      background: color-mix(in srgb, var(--platform) 20%, transparent);
      color: var(--platform);
      border: 1px solid var(--platform);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .channel {
      font-size: 12px;
      color: var(--muted);
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .description {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── Footer ── */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .cta-button {
      display: inline-block;
      background: var(--platform);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 6px;
      letter-spacing: 0.2px;
      text-decoration: none;
    }

    /* ── Copy panel ── */
    .copy-panel {
      width: min(1024px, 100%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
    }

    .copy-panel + .copy-panel { margin-top: 0; }

    .copy-label {
      color: #8b949e;
      font-size: 12px;
      margin: 0 0 8px;
    }

    .post-copy-text {
      width: 100%;
      min-height: 80px;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
      display: block;
    }

    .copy-btn {
      margin-top: 8px;
      padding: 6px 16px;
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .copy-btn:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">

    {{THUMBNAIL_ZONE}}

    <div class="video-body">
      <div class="platform-row">
        <span class="platform-badge">{{PLATFORM_BADGE}}</span>
        <span class="channel">{{CHANNEL}}</span>
      </div>
      <h2>{{VIDEO_TITLE}}</h2>
      <p class="description">{{DESCRIPTION_SNIPPET}}</p>
    </div>

    <div class="card-footer">
      <span class="cta-button">{{CTA}}</span>
    </div>

  </div>
  {{COPY_PANELS}}
  <script>
    function copyPost(id, btn) {
      var t = document.getElementById(id);
      if (!t) return;
      var orig = btn.textContent;
      function done() {
        btn.textContent = 'Copied ✓';
        setTimeout(function () { btn.textContent = orig; }, 2000);
      }
      function fallback() { try { t.select(); if (document.execCommand('copy')) done(); } catch (_) {} }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t.value).then(done).catch(fallback);
      } else {
        fallback();
      }
    }
  </script>
</body>
</html>
