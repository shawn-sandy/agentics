<!DOCTYPE html>
<!--
  react-card.html — Dark-mode React component showcase card for social posts.
  Distinct from snippet-card.html (single code snippet): this card frames the
  component implementation with a static preview pane and a props table.

  Static variables (exactly eight):
    {{COMPONENT_NAME}}  — Component name, e.g. "UserBadge" (HTML-escaped)
    {{FRAMEWORK_BADGE}} — Badge label, "React · TSX" or "React · JSX" (hardcoded by the skill from the file extension)
    {{PREVIEW_MARKUP}}  — Preview pane HTML, injected RAW (see Escaping below)
    {{COMPONENT_CODE}}  — Component source, MUST be HTML-escaped (&amp; &lt; &gt; &quot;)
    {{PROPS_ROWS}}      — <tr> rows for the props table tbody; all cell text MUST be
                          HTML-escaped (&amp; &lt; &gt; &quot;)
    {{REPO_SLUG}}       — e.g. "owner/repo" (HTML-escaped)
    {{SOURCE_PATH}}     — e.g. "src/components/UserBadge.tsx" (HTML-escaped)
    {{COPY_PANELS}}     — Copy panel HTML: one panel for a single site, or per-site
                          panels for "All sites" (see references/copy-panels.md)

  Escaping:
    {{PREVIEW_MARKUP}} is the ONLY variable injected raw. It must be a skill-authored
    static mockup (plain divs/spans/buttons using the .preview-state classes below or
    inline styles) — never user-sourced or repo-sourced content.
    {{COMPONENT_CODE}}, {{PROPS_ROWS}} cell text, {{COMPONENT_NAME}}, {{SOURCE_PATH}},
    and {{REPO_SLUG}} MUST be HTML-escaped by the skill before substitution.
    Escape order: & first, then < then > then ".

  Syntax highlighting:
    Uses highlight.js via CDN (github-dark theme). Playwright screenshots are taken
    in a local browser that fetches the CDN over the network — this works for the
    normal screenshot pipeline. If the CDN is unreachable, the card still renders
    correctly in dark mode (the inline CSS provides bg/text styling); only token
    colouring is absent.

    To make the card fully offline: download the highlight.js github-dark CSS and
    common languages bundle and replace the CDN <link> and <script> tags with inline
    <style> and <script> blocks.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{COMPONENT_NAME}}</title>

  <!-- highlight.js: github-dark theme + common languages bundle (SRI per cdnjs published hashes) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
        integrity="sha512-rO+olRTkcf304DQBxSWxln8JXCzTHlKnIdnMUwYvQa9/Jd4cQaNkItIUj6Z4nvW1dqK0SKXLbn9h4KwZTNtAyw=="
        crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
          integrity="sha512-D9gUyxqja7hBtkWpPWGt9wfbfaMGVt9gnyCvYa+jojwwPHLCzUm5i8rpk7vD7wNee9bA35eYIjobYPaQuKS1MQ=="
          crossorigin="anonymous"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof hljs !== 'undefined') { hljs.highlightAll(); }
    });
  </script>

  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #388bfd;
      --card-width: 1024px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: min(var(--card-width), 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* ── Header ── */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .component-name {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }

    .framework-badge {
      display: inline-block;
      /* React brand colour — hardcoded by design, not a theme variable */
      background-color: #61dafb;
      color: #0d1117;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    /* ── Zone labels (Preview / Props) ── */
    .zone-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    /* ── Preview pane ── */
    .preview-pane {
      /* Slightly lighter than --surface so the mockup area reads as a stage */
      background: #1c2128;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    /* Skill-authored state blocks: inline-flex so multiple states sit side by
       side and wrap to the next line at the pane edge */
    .preview-state {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 10px 28px 10px 0;
      vertical-align: top;
    }

    .preview-state-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    /* ── Implementation code block ── */
    .code-block {
      background: var(--bg);
      padding: 20px 24px;
      overflow-x: auto;
      max-height: 400px;
    }

    /* Override hljs background so our --bg colour shows through */
    .code-block pre,
    .code-block .hljs {
      background: transparent !important;
      padding: 0 !important;
      margin: 0;
    }

    .code-block pre code {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.65;
      /* Fallback colours when hljs is offline */
      color: var(--text);
      white-space: pre;
      tab-size: 2;
    }

    /* ── Props table ── */
    .props-zone {
      background: var(--surface);
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .props-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .props-table th {
      text-align: left;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .props-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }

    .props-table tbody tr:last-child td { border-bottom: none; }

    /* Monospace for the Name, Type, and Default columns */
    .props-table td:nth-child(1),
    .props-table td:nth-child(2),
    .props-table td:nth-child(4) {
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
    }

    /* ── Footer ── */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .repo-slug {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    .source-path {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Copy panel ── */
    .copy-panel {
      width: min(var(--card-width), 100%);
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      box-sizing: border-box;
    }

    .copy-panel + .copy-panel { margin-top: 0; }

    .copy-label {
      color: #8b949e;
      font-size: 12px;
      margin: 0 0 8px;
    }

    .post-copy-text {
      width: 100%;
      min-height: 80px;
      background: #0d1117;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
      display: block;
    }

    .copy-btn {
      margin-top: 8px;
      padding: 6px 16px;
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .copy-btn:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">

    <div class="card-header">
      <span class="component-name">{{COMPONENT_NAME}}</span>
      <span class="framework-badge">{{FRAMEWORK_BADGE}}</span>
    </div>

    <div class="preview-pane">
      <span class="zone-label">Preview</span>
      {{PREVIEW_MARKUP}}
    </div>

    <div class="code-block">
      <pre><code class="language-tsx">{{COMPONENT_CODE}}</code></pre>
    </div>

    <div class="props-zone">
      <span class="zone-label">Props</span>
      <table class="props-table">
        <caption class="sr-only">Component props</caption>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Type</th>
            <th scope="col">Required</th>
            <th scope="col">Default</th>
            <th scope="col">Description</th>
          </tr>
        </thead>
        <tbody>
          {{PROPS_ROWS}}
        </tbody>
      </table>
    </div>

    <div class="card-footer">
      <span class="repo-slug">{{REPO_SLUG}}</span>
      <span class="source-path">{{SOURCE_PATH}}</span>
    </div>

  </div>
  {{COPY_PANELS}}
  <script>
    function copyPost(id, btn) {
      var t = document.getElementById(id);
      if (!t) return;
      var orig = btn.textContent;
      function done() {
        btn.textContent = 'Copied ✓';
        setTimeout(function () { btn.textContent = orig; }, 2000);
      }
      function fallback() { try { t.select(); if (document.execCommand('copy')) done(); } catch (_) {} }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t.value).then(done).catch(fallback);
      } else {
        fallback();
      }
    }
  </script>
</body>
</html>
