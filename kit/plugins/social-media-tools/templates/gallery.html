<!DOCTYPE html>
<!--
  gallery.html — Media library for saved social media cards.

  Static variables (substituted by the media-library skill):
    GALLERY_ENTRIES  — Repeated <a> blocks, one per saved card
    CARD_COUNT       — Total number of cards displayed
    GENERATED_AT     — ISO timestamp of gallery generation
    HREF_HOME / HREF_PLANS / HREF_PROTOTYPES / HREF_ARTIFACTS / HREF_SOCIAL
                     — Topbar tab targets, each relative to this page's own
                       output directory
    COUNT_PLANS / COUNT_PROTOTYPES / COUNT_ARTIFACTS / COUNT_SOCIAL
                     — Topbar tab counts, read off disk by the skill
    CUR_HOME / CUR_PLANS / CUR_PROTOTYPES / CUR_ARTIFACTS / CUR_SOCIAL
                     — Exactly one is replaced with aria-current="page";
                       the rest with the empty string

  Token set, theme script, and topbar are the same shell the plan-agent
  galleries carry — the Social tab is one of the five this bar offers, and a
  tab that lands on a differently-styled page reads as a broken link. The card
  grid below is this gallery's own: thumbnails suit a grid in a way rows do not.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Library</title>
  <script>
    /* Before first paint — shares the `plan-theme` key with the other
       galleries, so a choice made on one carries to all of them. */
    try {
      var t = localStorage.getItem('plan-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) { /* no storage — prefers-color-scheme decides */ }
  </script>
  <style>
    /* ── Design tokens — the same palette the generated plans use ──── */
    :root {
      --paper: #fbfbfd;
      --panel: #ffffff;
      --sunk: #f4f4f8;
      --ink: #14141c;
      --ink-2: #494959;
      --ink-3: #63637a;
      --rule: #e4e4ee;
      --accent: #3730c4;
      --accent-soft: #eeedfb;
      --accent-line: #c6c2f0;
      --radius: 4px;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --prose: var(--ui);
      color-scheme: light;

      /* This gallery's own names, aliased onto the shared set. var() resolves
         where it is used, so the dark block below only has to restate the
         base tokens and every alias follows. */
      --bg: var(--paper);
      --surface: var(--panel);
      --border: var(--rule);
      --text: var(--ink);
      --muted: var(--ink-3);
    }
    /* Written twice: an explicit choice has to beat the OS preference, and
       plain CSS cannot share a block between an attribute selector and a
       media query. Keep the two lists in sync. */
    :root[data-theme="dark"] {
      --paper: #0f0f16;
      --panel: #17171f;
      --sunk: #1d1d27;
      --ink: #ecebf2;
      --ink-2: #b2b0c2;
      --ink-3: #8a889c;
      --rule: #2a2a36;
      --accent: #a8a2f5;
      --accent-soft: #1f1d33;
      --accent-line: #454070;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #0f0f16;
        --panel: #17171f;
        --sunk: #1d1d27;
        --ink: #ecebf2;
        --ink-2: #b2b0c2;
        --ink-3: #8a889c;
        --rule: #2a2a36;
        --accent: #a8a2f5;
        --accent-soft: #1f1d33;
        --accent-line: #454070;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui);
      min-height: 100vh;
      padding: 32px;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── Topbar ──────────────────────────────────────────────────────
       Full-bleed against the body padding; the negative margins cancel it. */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: -32px -32px 24px;
      border-bottom: 1px solid var(--rule);
      /* Opaque first: a browser without color-mix drops the second
         declaration, and a transparent sticky bar over scrolled text is
         unreadable. */
      background: var(--paper);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      backdrop-filter: blur(12px);
    }
    .topbar-in {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      min-height: 48px;
      flex-wrap: wrap;
    }
    .mark {
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--ink);
    }
    .mark::before { content: "\25A4 "; color: var(--accent); }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-left: auto; }
    .tabs a {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      padding: 0.4rem 0.6rem;
      border-radius: 3px;
      text-decoration: none;
      color: var(--ink-2);
    }
    .tabs a:hover { color: var(--ink); background: var(--sunk); }
    .tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
    .tabs a .n { color: var(--ink-3); margin-left: 0.3rem; }
    /* --ink-3 on the current tab's accent-soft chip measures 4.46:1, just
       under AA — the count takes the tab's own colour there instead. */
    .tabs a[aria-current="page"] .n { color: var(--accent); }

    .gallery-header {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      align-items: flex-end;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .gallery-header h1 {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .gallery-header p {
      font-family: var(--prose);
      font-size: 1.0625rem;
      color: var(--ink-2);
      max-width: 52ch;
      line-height: 1.6;
      margin-top: 0.5rem;
    }

    .theme-toggle {
      margin-left: auto;
      min-width: 44px;
      min-height: 44px;
      padding: 0.4rem 0.9rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      cursor: pointer;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent-line); }

    .toolbar {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    /* No colour transitions anywhere below: every colour here is a var(), and
       Chrome keeps painting the pre-toggle value when only a custom property
       changes — the theme toggle left the chips and the "View image" links
       stuck in the light palette at 3.6:1 and 2.5:1. */
    .search-box {
      flex: 1;
      min-width: 200px;
      max-width: 360px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .search-box::placeholder {
      color: var(--muted);
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-chip {
      padding: 4px 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-chip:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .filter-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent-line);
      color: var(--accent);
    }

    .visible-count {
      font-size: 12px;
      color: var(--muted);
      max-width: 1200px;
      margin: 0 auto 16px;
    }

    /* Grid view */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .gallery-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(56, 139, 253, 0.15);
    }

    .thumb-container {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .thumb-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Shown when a card has no screenshot — it names the card's type, so it
       is content, not chrome, and reads at --ink-3 rather than rule grey. */
    .thumb-fallback {
      font-size: 28px;
      font-weight: 700;
      color: var(--ink-3);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .card-info {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .card-info-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .type-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    /* One neutral badge rather than eight hues: the old palette was fixed to a
       dark background and half of it fell under 4.5:1 the moment this gallery
       gained a light theme. Type is already filterable above — the badge only
       has to be readable. */
    .type-badge {
      font-family: var(--mono);
      background: var(--sunk);
      border: 1px solid var(--rule);
      color: var(--ink-2);
    }

    .card-date {
      font-size: 12px;
      color: var(--muted);
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    .card-topic {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

    .card-file {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      word-break: break-all;
    }

    .gallery-card-wrap {
      display: flex;
      flex-direction: column;
    }

    .open-img-link {
      display: block;
      font-size: 12px;
      color: var(--accent);
      text-align: center;
      padding: 4px 0 8px;
      text-decoration: none;
      background: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }

    .open-img-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    #imgDialog {
      border: none;
      background: transparent;
      padding: 0;
      max-width: 90vw;
      max-height: 90vh;
    }

    #imgDialog::backdrop {
      background: rgba(0, 0, 0, 0.8);
    }

    #imgDialog .dialog-content {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #imgDialog img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 6px;
    }

    #imgDialog .dialog-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #imgDialog .dialog-close:hover {
      background: var(--border);
    }

    @media (prefers-reduced-motion: reduce) {
      #imgDialog, #imgDialog::backdrop {
        transition: none;
        animation: none;
      }
    }

    .no-results {
      max-width: 1200px;
      margin: 64px auto;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }

    .gallery-footer {
      max-width: 1200px;
      margin: 32px auto 0;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gallery-footer span {
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body { padding: 16px; }
      .topbar { margin: -16px -16px 24px; }
      .topbar-in { padding: 0 1rem; }
      .toolbar { gap: 8px; }
      .search-box { max-width: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="mark" href="{{HREF_HOME}}">agentics</a>
      <nav class="tabs" aria-label="Collections">
        <a href="{{HREF_HOME}}" {{CUR_HOME}}>Home</a>
        <a href="{{HREF_PLANS}}" {{CUR_PLANS}}>Plans<span class="n">{{COUNT_PLANS}}</span></a>
        <a href="{{HREF_PROTOTYPES}}" {{CUR_PROTOTYPES}}>Prototypes<span class="n">{{COUNT_PROTOTYPES}}</span></a>
        <a href="{{HREF_ARTIFACTS}}" {{CUR_ARTIFACTS}}>Artifacts<span class="n">{{COUNT_ARTIFACTS}}</span></a>
        <a href="{{HREF_SOCIAL}}" {{CUR_SOCIAL}}>Social<span class="n">{{COUNT_SOCIAL}}</span></a>
      </nav>
    </div>
  </header>

  <div class="gallery-header">
    <div>
      <h1>Media Library</h1>
      <p>{{CARD_COUNT}} saved cards &mdash; click any card to view it.</p>
    </div>
    <button
      class="theme-toggle"
      type="button"
      id="themeToggle"
      aria-pressed="false"
      aria-label="Use dark theme"
    >
      Dark
    </button>
  </div>

  <div class="toolbar">
    <input type="text" class="search-box" placeholder="Search by topic or type..." id="searchBox" aria-label="Search cards by topic or type">
    <div class="filter-chips" id="filterChips">
      <button class="filter-chip active" data-type="all" aria-pressed="true">All</button>
      <button class="filter-chip" data-type="diff" aria-pressed="false">Diff</button>
      <button class="filter-chip" data-type="feature" aria-pressed="false">Feature</button>
      <button class="filter-chip" data-type="quote" aria-pressed="false">Quote</button>
      <button class="filter-chip" data-type="blog" aria-pressed="false">Blog</button>
      <button class="filter-chip" data-type="snippet" aria-pressed="false">Snippet</button>
      <button class="filter-chip" data-type="video" aria-pressed="false">Video</button>
      <button class="filter-chip" data-type="project" aria-pressed="false">Project</button>
      <button class="filter-chip" data-type="session" aria-pressed="false">Session</button>
    </div>
  </div>

  <div class="visible-count" id="visibleCount"></div>

  <div class="gallery-grid" id="galleryGrid">
    {{GALLERY_ENTRIES}}
  </div>

  <div class="no-results" id="noResults">No cards match your search.</div>

  <div class="gallery-footer">
    <span>{{CARD_COUNT}} cards</span>
    <span>Generated {{GENERATED_AT}}</span>
  </div>

  <dialog id="imgDialog">
    <div class="dialog-content">
      <img id="imgDialogImg" src="" alt="">
      <button class="dialog-close" aria-label="Close">&times;</button>
    </div>
  </dialog>

  <script>
    function showFallback(img) {
      var container = img.parentElement;
      img.style.display = 'none';
      var fb = container.querySelector('.thumb-fallback');
      if (fb) fb.style.display = 'block';
    }

    var imgDialog = document.getElementById('imgDialog');
    var imgDialogImg = document.getElementById('imgDialogImg');
    var dialogCloseBtn = imgDialog.querySelector('.dialog-close');

    document.getElementById('galleryGrid').addEventListener('click', function(e) {
      var btn = e.target.closest('.open-img-link');
      if (!btn) return;
      var imgSrc = btn.getAttribute('data-img');
      if (!imgSrc || !/^[a-zA-Z0-9._-]+\.png$/i.test(imgSrc)) return;
      imgDialogImg.src = encodeURI(imgSrc);
      imgDialogImg.alt = btn.getAttribute('data-topic') || 'Social card image';
      imgDialog.showModal();
    });

    dialogCloseBtn.addEventListener('click', function() {
      imgDialog.close();
    });

    imgDialog.addEventListener('click', function(e) {
      if (e.target === imgDialog) imgDialog.close();
    });

    var activeType = 'all';
    var searchText = '';
    var grid = document.getElementById('galleryGrid');
    var cards = grid.querySelectorAll('.gallery-card-wrap');
    var chips = document.querySelectorAll('.filter-chip');
    var searchBox = document.getElementById('searchBox');
    var noResults = document.getElementById('noResults');
    var visibleCount = document.getElementById('visibleCount');

    function applyFilters() {
      var shown = 0;
      for (var i = 0; i < cards.length; i++) {
        var wrap = cards[i];
        var inner = wrap.querySelector('.gallery-card');
        var type = inner ? inner.getAttribute('data-type') || '' : '';
        var topic = inner ? inner.getAttribute('data-topic') || '' : '';
        var matchType = activeType === 'all' || type === activeType;
        var matchSearch = !searchText ||
          topic.toLowerCase().indexOf(searchText) !== -1 ||
          type.toLowerCase().indexOf(searchText) !== -1;
        if (matchType && matchSearch) {
          wrap.style.display = '';
          shown++;
        } else {
          wrap.style.display = 'none';
        }
      }
      noResults.style.display = shown === 0 ? 'block' : 'none';
      visibleCount.textContent = shown === cards.length
        ? ''
        : 'Showing ' + shown + ' of ' + cards.length + ' cards';
    }

    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener('click', function() {
        for (var j = 0; j < chips.length; j++) {
          chips[j].classList.remove('active');
          chips[j].setAttribute('aria-pressed', 'false');
        }
        this.classList.add('active');
        this.setAttribute('aria-pressed', 'true');
        activeType = this.getAttribute('data-type');
        applyFilters();
      });
    }

    searchBox.addEventListener('input', function() {
      searchText = this.value.trim().toLowerCase();
      applyFilters();
    });

    var themeBtn = document.getElementById('themeToggle');
    function resolvedTheme() {
      var set = document.documentElement.getAttribute('data-theme');
      if (set === 'dark' || set === 'light') return set;
      return window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
    }
    function syncThemeButton() {
      var dark = resolvedTheme() === 'dark';
      themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
      themeBtn.setAttribute('aria-label', dark ? 'Use light theme' : 'Use dark theme');
      themeBtn.textContent = dark ? 'Light' : 'Dark';
    }
    themeBtn.addEventListener('click', function() {
      var next = resolvedTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('plan-theme', next); } catch (e) { /* not persisted */ }
      syncThemeButton();
    });
    syncThemeButton();
  </script>
</body>
</html>
