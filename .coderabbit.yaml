# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for shawn-sandy/agentics
# Marketplace system for Claude Code plugins
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
      - "^feat/.*$"
      - "^fix/.*$"
      - "^claude/.*$"

  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!**/.git/**"

  path_instructions:
    - path: ".claude-plugin/marketplace.json"
      instructions: |
        This is the central plugin registry. Verify:
        - Each plugin has a unique `name`
        - `version` is set here and NOT in the plugin's `plugin.json`
        - `source.path` matches an actual directory under `kit/plugins/`
        - `category` is one of: development, productivity, learning, testing, documentation, security
        - `tags` are specific and searchable (avoid generic terms like "tool" or "helper")
        - No duplicate plugin names exist
        - Version bumps follow semver: patch=fix/typo, minor=new command/skill/agent, major=breaking rename or removal

    - path: "kit/plugins/**/.claude-plugin/plugin.json"
      instructions: |
        Plugin manifest file. Verify:
        - `name` field is present and matches the directory name
        - `version` is NOT set here (version is managed in marketplace.json)
        - `homepage` URL points to the plugin directory, not the repo root:
          format must be `https://github.com/shawn-sandy/agentics/tree/main/kit/plugins/{plugin-name}`

    - path: "kit/plugins/**"
      instructions: |
        Plugin source code. Check for:
        - CHANGELOG.md present and updated when plugin logic changes
        - README.md exists with usage instructions
        - Skill SKILL.md files should declare every tool they use in `allowed-tools:` frontmatter;
          scoped forms like `Bash(git *)` are preferred over broad `Bash(*)`
        - Command files live under `commands/<command-name>.md` and are invoked as `/plugin-name:command-name`
        - Agent files live under `agents/`
        - Plan files for the change should exist in `docs/plans/` and be included in the commit

    - path: "docs/plans/**"
      instructions: |
        Plan files must be committed alongside the related plugin changes they describe.
        Check that the plan filename is descriptive (not a generic timestamp) and has frontmatter.
        Flag stale plan files that reference removed features.

    - path: "tests/**"
      instructions: |
        Test fixtures and demo scripts. Ensure `tests/fixtures/valid-plugin/` remains a valid
        reference implementation — it is used by validation logic and must not diverge from
        current plugin structure conventions.

    - path: ".claude/rules/**"
      instructions: |
        Scoped authoring rules for Claude Code. Changes here affect AI-assisted development
        behaviour across the repo. Review for accuracy and consistency with CLAUDE.md.

  finishing_touches:
    docstrings:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
