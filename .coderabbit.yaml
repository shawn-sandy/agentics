# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for shawn-sandy/agentics
# Marketplace system for Claude Code plugins
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
      - "^feat/.*$"
      - "^fix/.*$"
      - "^claude/.*$"

  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!**/.git/**"

  path_instructions:
    - path: ".claude-plugin/marketplace.json"
      instructions: |
        Flag if: `version` appears in a plugin.json instead of here, or `source.path` doesn't match an actual `kit/plugins/` directory.

    - path: "kit/plugins/**/.claude-plugin/plugin.json"
      instructions: |
        Flag if: `version` is set here (must be in marketplace.json only), or `homepage` doesn't point to the plugin's own directory.

    - path: "kit/plugins/**"
      instructions: |
        Flag if: CHANGELOG.md is missing or not updated, or a SKILL.md file lacks an `allowed-tools:` frontmatter line.

    - path: "docs/plans/**"
      instructions: |
        Flag if: the plan filename is a bare timestamp or lacks frontmatter.

    - path: "tests/**"
      instructions: |
        Flag if: `tests/fixtures/valid-plugin/` diverges from current plugin structure conventions.

  tools:
    markdownlint:
      enabled: false
    yamllint:
      enabled: false

  finishing_touches:
    docstrings:
      enabled: false

chat:
  auto_reply: false

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
