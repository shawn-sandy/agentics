# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for shawn-sandy/agentics
# Marketplace system for Claude Code plugins
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"

  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!**/.git/**"
    - "!docs/plans/**"
    - "!docs/media/**"
    - "!**/*.png"
    - "!**/*.html"
    - "!**/CHANGELOG.md"
    - "!kit/plugins/**/references/**"

  path_instructions:
    - path: ".claude-plugin/marketplace.json"
      instructions: |
        Flag if: `version` appears in a plugin.json instead of here, or `source.path` doesn't match an actual `kit/plugins/` directory.

    - path: "kit/plugins/**/.claude-plugin/plugin.json"
      instructions: |
        Flag if: `version` is set here (must be in marketplace.json only), or `homepage` doesn't point to the plugin's own directory.

    - path: "kit/plugins/**/skills/**/SKILL.md"
      instructions: |
        Flag if: the SKILL.md file lacks an `allowed-tools:` frontmatter line.

    - path: "tests/**"
      instructions: |
        Flag if: `tests/fixtures/valid-plugin/` diverges from current plugin structure conventions.

  tools:
    markdownlint:
      enabled: false
    yamllint:
      enabled: false

  finishing_touches:
    docstrings:
      enabled: false

chat:
  auto_reply: false

knowledge_base:
  opt_out: false
  learnings:
    scope: local
  issues:
    scope: local
