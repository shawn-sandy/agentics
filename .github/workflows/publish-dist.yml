name: Publish dist to agentics-kit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: publish-dist
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check README plugin table is in sync
        run: node scripts/build-readme-table.mjs --check
      - name: Verify no plugin files are git-ignored
        run: bash tests/publish/test-no-ignored-plugin-files.sh
      - name: Build dist
        run: node scripts/build-dist.mjs
      - name: Verify no leaks
        run: node scripts/build-dist.mjs --check
      - name: Smoke test dist
        run: bash tests/publish/smoke-clean-dist.sh
      - name: Test dist transforms
        run: node tests/publish/test-dist-transforms.mjs
      - name: Test prototype portability
        run: bash tests/plugins/test-prototype-portability.sh
      - name: Test prototypes gallery builder
        run: bash tests/plugins/test-build-prototypes-index.sh
      - name: Test prototype persistence
        run: node tests/plugins/test-prototype-persistence.mjs
      - name: Test save-artifact skill
        run: bash tests/plugins/test-save-artifact.sh
      - name: Test artifact title mechanism
        run: node tests/plugins/test-artifact-titles.mjs
      - name: Test build skill ships and owns the implementation gates
        run: bash tests/plugins/test-build-skill.sh
      - name: Publish to agentics-kit
        run: node scripts/build-dist.mjs --publish
        env:
          DIST_REPO_URL: ${{ vars.DIST_REPO_URL }}
          DIST_REPO_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          TITLE: publish-dist is failing
        run: |
          set -euo pipefail
          # ponytail: plain list + exact-title filter, not `gh issue list --search` —
          # the search index lags behind issue creation and would re-open duplicates.
          issue=$(gh issue list --repo "$REPO" --state open --limit 500 --json number,title \
            -q "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          failed=$(gh run view "$GITHUB_RUN_ID" --repo "$REPO" --json jobs \
            -q '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")')
          body="Failed step: \`${failed:-unknown}\` on $(date -u +'%Y-%m-%d %H:%M UTC'). [View run]($RUN_URL)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body" --repo "$REPO"
          else
            gh issue create --title "$TITLE" --body "$body" --label bug --repo "$REPO"
          fi
      - name: Close failure issue on success
        # Bookkeeping after the publish already succeeded — a transient API
        # error here must not turn a green publish into a red run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          TITLE: publish-dist is failing
        run: |
          set -euo pipefail
          issue=$(gh issue list --repo "$REPO" --state open --limit 500 --json number,title \
            -q "[.[] | select(.title == \"$TITLE\") | .number] | first // empty")
          [ -n "$issue" ] || exit 0
          gh issue close "$issue" --repo "$REPO" \
            --comment "Recovered — [run]($RUN_URL) passed all gates."
