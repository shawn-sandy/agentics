name: Check plugin versions

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard plugin versions
        run: node scripts/check-plugin-versions.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
      # One runner, every test: tests/run-all.sh globs tests/**/test-*.sh,
      # tests/**/test-*.mjs, and tests/**/*.test.mjs, so a new test file is
      # wired into CI by existing — there is nothing to add here. Before this,
      # the workflow hand-enumerated 20 of the tree's 77 test files and the
      # rest ran only when someone remembered to run them by hand. The skip
      # list (with a reason per entry) lives at the top of the runner; the
      # rationale for each individual test lives in that test file's header
      # comment, which the per-step comments this replaced were duplicating.
      - name: Run the test suite
        run: bash tests/run-all.sh
      # Explicit because run-all skips it: on this runner the `claude` CLI is
      # absent, so the test's behavioral half self-skips and its static guard
      # checks still run fast. Locally the CLI exists and the chained harness
      # is slow (and hangs inside a nested Claude session), which is why the
      # runner leaves it out — see the skip list in tests/run-all.sh.
      - name: Test pruned skill imperatives kept every load-bearing guard
        run: bash tests/plugins/test-imperative-pruning.sh
