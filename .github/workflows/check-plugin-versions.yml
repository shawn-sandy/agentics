name: Check plugin versions

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard plugin versions
        run: node scripts/check-plugin-versions.mjs
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Unit-test the guard
        run: node tests/publish/test-check-plugin-versions.mjs
      # Pre-merge gate. publish-dist.yml also runs this, but that workflow is
      # schedule/dispatch-only, so on its own it catches a regression the
      # morning after the merge rather than at review time.
      - name: Test build skill ships and owns the implementation gates
        run: bash tests/plugins/test-build-skill.sh
      # Same rationale: the merge? hook fires on every prompt and the merge
      # skill ends in an irreversible squash-merge, so its trigger boundary and
      # safety gates are checked at review time, not the next morning.
      - name: Test merge? shorthand hook and merge skill contract
        run: bash tests/plugins/test-merge-shorthand.sh
      # CLAUDE.md is loaded into every session in this repo, so growth there is
      # a tax on all future work — and it grows by ordinary PRs adding "just one
      # more line", which is exactly what review misses.
      - name: Test CLAUDE.md stays within its context budget
        run: bash tests/plugins/test-claude-md-budget.sh
      # The gallery merge driver runs during `git merge`, where a silent wrong
      # answer looks like lost plan or artifact cards rather than a failure.
      # Nothing else exercises it, so this is its only regression gate.
      - name: Test gallery index merge driver
        run: bash tests/plugins/test-merge-gallery-index.sh
      # Three of these six skills carry irreversible git operations: `ship` and
      # `ship-autonomous` push to remotes and end in a squash merge, and
      # `branch-agent` creates and checks out refs and can stash and pop a dirty
      # tree — it never commits, pushes, or merges. The three share-* skills
      # publish to a public gallery behind a scrub gate. So their guards are
      # checked at review time by reading the SKILL.md core: a guard that drifts
      # behind a reference link is a guard that may never load, and its absence
      # is invisible until the day it should have fired.
      - name: Test the git-agent and social-media-tools cores stay split
        run: bash tests/plugins/test-skill-split-git-social.sh
      # The sibling gate for PR #487's six skills (artifact-to-post,
      # diff-artifact, optimizing-skill-frontmatter, path-rules-advisor,
      # prompt-artifact, tdd-fix). Same invariant, disjoint file set — a SKILL.md
      # body is paid in full every time the skill fires, so a core creeping back
      # over its ceiling shows up in no diff review of a single file.
      - name: Test the PR 487 skill cores stay split
        run: bash tests/plugins/test-remaining-skill-splits.sh
      # The five tests below read shipped skill bodies as data, and four of them
      # were retargeted in this PR to follow content that moved behind a
      # reference link. None of them was wired into CI, so nothing stopped a
      # future edit from moving a literal back and quietly turning a safety
      # assertion into a no-op — the same decay the step above exists to prevent.
      # All five pass on main unchanged, so wiring them breaks nothing in flight.
      - name: Test artifact-tools contracts survive the reference split
        run: bash tests/plugins/test-artifact-tools.sh
      - name: Test artifact-to-post contracts survive the reference split
        run: bash tests/plugins/test-artifact-to-post.sh

      # The three recap commands are three framings of one workflow, and the
      # duplication came back once already. Nothing stops the next feature from
      # being pasted into all three except a check that runs before merge.
      - name: Test the recap commands stay deduplicated
        run: bash tests/plugins/test-recap-command-dedupe.sh
      - name: Test the memory-tools write guard executes shipped code
        run: bash tests/plugins/test-memory-doctor-guard.sh
      - name: Test generator skills verify their own output
        run: bash tests/plugins/test-generator-skills-verify-output.sh
      - name: Test every skill description stays within budget
        run: bash tests/plugins/test-description-budget.sh
      # The plan-mode guard fails silently in both directions: strip it and a
      # skill writes from inside a mode the user deliberately entered; re-expand
      # it and 40 files each re-teach the model something it already knows.
      # Neither shows up in a diff review of a single file.
      - name: Test plan-mode guard survives without its boilerplate
        run: bash tests/plugins/test-exitplanmode-guard.sh
      # Guards the imperative prune. Removing a process reminder and removing a
      # safety guard look identical in a diff — both are a deleted sentence — and
      # the guards here sit in front of an irreversible squash merge
      # (ship-autonomous), a stash/pop over the user's uncommitted work
      # (branch-agent), and a plan-authoring skill forbidden from writing source
      # (implementation-plan). This step is the structural half: it asserts every
      # KEEP-classified guard is still literally present and that no frontmatter
      # `description:` drifted. The behavioral half needs the `claude` CLI, which
      # this runner has no access to, so it runs locally via
      # tests/plugins/test-skill-behavior-baselines.sh — which exits 1 rather
      # than skipping, so it cannot go green by being absent.
      - name: Test pruned skill imperatives kept every load-bearing guard
        run: bash tests/plugins/test-imperative-pruning.sh
