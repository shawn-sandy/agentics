name: Auto Version Bump

on:
  push:
    branches: [main]
    paths:
      - 'kit/plugins/**'

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  bump-versions:
    name: Bump plugin versions
    # Skip CI-generated commits to prevent infinite loops
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'ci(versions):')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Run auto-bump
        id: bump
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: node scripts/auto-bump-version.mjs

      - name: Commit and push
        if: steps.bump.outputs.bumped == 'true'
        env:
          BUMP_SUMMARY: ${{ steps.bump.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git diff --cached --quiet && exit 0
          git commit -m "ci(versions): auto-bump plugin versions [skip ci]

          ${BUMP_SUMMARY}"
          git pull --rebase origin main
          git push
