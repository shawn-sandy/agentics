    - paragraph [ref=e16]: Social media post
    - textbox [ref=e17]: "Just shipped a new skill to the agentics-kit plugin marketplace: /project-share. If you use Claude Code and find yourself wanting to write a LinkedIn post about your project — not tied to any specific commit or diff, just \"here's what this thing does\" — that's exactly what project-share is for. It works alongside /code-share (which generates social cards from your git history). The difference: code-share is event-driven (what just changed), project-share is topic-driven (what this project IS). You pick a topic — architecture, design decisions, a specific feature, the problem it solves — and it drafts platform-aware copy + generates a styled dark-mode card image. The agentics-kit marketplace now has 17 plugins. If you're building on Claude Code and want to make your work more shareable without manually writing posts, this might be worth a look. #ClaudeCode #DeveloperTools #AITools #OpenSource"
